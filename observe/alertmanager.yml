route:
  receiver: feishu
  group_by: ["alertname", "router", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: feishu
      matchers:
        - source = luma-observe

receivers:
  - name: feishu
    webhook_configs:
      - url: http://127.0.0.1:9095/webhook
        send_resolved: true
        timeout: 8s

inhibit_rules:
  - source_matchers: ["alertname = LumaObserveNomadDown"]
    target_matchers: ["alertname =~ LumaJob.*"]
    equal: ["source"]
