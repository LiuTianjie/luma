groups:
  - name: luma-observe-apps
    interval: 30s
    rules:
      - alert: LumaAppHTTPErrorRate
        expr: |
          (
            sum by (router) (rate(traefik_router_requests_total{code=~"5.."}[5m]))
            /
            clamp_min(sum by (router) (rate(traefik_router_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          source: luma-observe
        annotations:
          summary: "Router {{ $labels.router }} 5xx ratio is above 5%"
          description: "Public HTTP errors for this Traefik router stayed high for 5 minutes."

      - alert: LumaJobFailedAllocations
        expr: luma_observe_job_failed > 0
        for: 2m
        labels:
          severity: warning
          source: luma-observe
        annotations:
          summary: "Job {{ $labels.job }} has failed allocations"
          description: "Nomad summary reports failed allocations; this is application health, not node CPU."

      - alert: LumaJobNotRunning
        expr: luma_observe_job_running == 0 and luma_observe_job_queued == 0
        for: 5m
        labels:
          severity: critical
          source: luma-observe
        annotations:
          summary: "Job {{ $labels.job }} has no running allocations"
          description: "The Nomad job is not running and not queued."

      - alert: LumaAllocRestartStorm
        expr: max by (job, task) (luma_observe_alloc_restarts) > 5
        for: 10m
        labels:
          severity: warning
          source: luma-observe
        annotations:
          summary: "Job {{ $labels.job }} task {{ $labels.task }} is restarting"
          description: "A live allocation exceeded 5 restarts."

      - alert: LumaObserveNomadDown
        expr: luma_observe_nomad_up == 0
        for: 2m
        labels:
          severity: critical
          source: luma-observe
        annotations:
          summary: "luma-observe cannot reach Nomad"
          description: "The nomad-exporter on the manager lost the local Nomad API."
