groups:
  - name: luma-observe-apps
    interval: 30s
    rules:
      - record: luma_app:http_requests:rate5m
        expr: |
          sum by (app) (
            rate(traefik_router_requests_total[5m])
            * on (router) group_left(app) luma_observe_router_app
          )

      - record: luma_app:http_errors:rate5m
        expr: |
          sum by (app) (
            rate(traefik_router_requests_total{code=~"5.."}[5m])
            * on (router) group_left(app) luma_observe_router_app
          )

      - record: luma_app:http_duration_seconds_bucket:rate5m
        expr: |
          sum by (app, le) (
            rate(traefik_router_request_duration_seconds_bucket[5m])
            * on (router) group_left(app) luma_observe_router_app
          )

      - record: luma_app:http_duration_seconds:p90
        expr: histogram_quantile(0.90, luma_app:http_duration_seconds_bucket:rate5m)

      - record: luma_app:http_duration_seconds:p95
        expr: histogram_quantile(0.95, luma_app:http_duration_seconds_bucket:rate5m)

      - record: luma_app:http_duration_seconds:p99
        expr: histogram_quantile(0.99, luma_app:http_duration_seconds_bucket:rate5m)

      - alert: LumaAppHTTPErrorRate
        expr: |
          luma_app:http_errors:rate5m
          /
          clamp_min(luma_app:http_requests:rate5m, 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          source: luma-observe
        annotations:
          summary: "App {{ $labels.app }} 5xx ratio is above 5%"
          description: "Public HTTP errors for this Luma app stayed high for 5 minutes."

      - alert: LumaJobFailedAllocations
        expr: luma_observe_job_failed > 0
        for: 2m
        labels:
          severity: warning
          source: luma-observe
        annotations:
          summary: "App {{ $labels.app }} has failed allocations"
          description: "Nomad still wants this job to run, but allocations are failed or lost."

      - alert: LumaJobNotRunning
        expr: |
          luma_observe_job_active == 1
          and luma_observe_job_running == 0
          and luma_observe_job_queued == 0
        for: 5m
        labels:
          severity: critical
          source: luma-observe
        annotations:
          summary: "App {{ $labels.app }} has no running allocations"
          description: "The Nomad job is active but not running and not queued."

      - alert: LumaAllocRestartStorm
        expr: max by (app, job, task) (luma_observe_alloc_restarts) > 5
        for: 10m
        labels:
          severity: warning
          source: luma-observe
        annotations:
          summary: "App {{ $labels.app }} task {{ $labels.task }} is restarting"
          description: "A live allocation exceeded 5 restarts."

      - alert: LumaObserveNomadDown
        expr: luma_observe_nomad_up == 0
        for: 2m
        labels:
          severity: critical
          source: luma-observe
        annotations:
          summary: "luma-observe cannot reach Nomad"
          description: "The nomad-exporter on the manager lost the local Nomad API."
