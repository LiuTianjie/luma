receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317
  otlp/mesh:
    protocols:
      http:
        endpoint: ${env:LUMA_OTLP_MESH_BIND}:4319
        include_metadata: true
        auth:
          authenticator: bearertokenauth
  prometheus:
    config:
      scrape_configs:
        - job_name: traefik
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8082"]
        - job_name: nomad-exporter
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:9107"]
        - job_name: log-shipper
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:9108"]
        - job_name: luma-control
          scrape_interval: 15s
          scrape_timeout: 5s
          metrics_path: /v1/metrics
          static_configs:
            - targets: ["127.0.0.1:8080"]
        - job_name: collector
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8888"]
        - job_name: observe-access
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8429"]

        - job_name: victoria
          scrape_interval: 30s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8428"]
        - job_name: victoria-logs
          scrape_interval: 30s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:9428"]
        - job_name: tempo
          scrape_interval: 30s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:3200"]
        - job_name: vmalert
          scrape_interval: 30s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8880"]
        - job_name: alertmanager
          scrape_interval: 30s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:9093"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1536
    spike_limit_mib: 256
  # Applications opt in through Resource attributes. Keep the branches
  # complementary so every accepted span reaches exactly one RED connector.
  filter/span-default:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["luma.observe.span_metrics"] == "service"'
  filter/span-service:
    error_mode: ignore
    traces:
      span:
        - 'not (resource.attributes["luma.observe.span_metrics"] == "service")'
  # Only newly derived, opted-in metrics use a service Resource. The connector
  # otherwise copies its first process's metadata even when its cache key is
  # narrower. Native metrics and stored traces retain their original Resource.
  transform/span-service-resource:
    error_mode: ignore
    metric_statements:
      # The mode label also prevents a collision with default sources that
      # legitimately have no instance/host attributes and share these six keys.
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "deployment.environment.name", "luma.stack", "luma.task", "luma.region", "luma.observe.span_metrics"])
  # Node agents hold Control requests open by design (lease long-polls, the
  # terminal WebSocket). Every one exceeds the slow threshold, so without this
  # they were ~95% of stored traces. Traefik still counts them in its metrics.
  filter/control-agent:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(attributes["url.path"], "^/v1/(node-agent|terminal)/")'
        - 'IsMatch(attributes["url.full"], "/v1/(node-agent|terminal)/")'
  # Completed task roots are sampled separately from their children. An early
  # child must not decide whether a much later failed execution root is kept.
  # Keep these predicates complementary; nested manual tasks stay in the normal
  # trace branch, where the trace may already have a sampling decision.
  filter/exclude-task-roots:
    error_mode: ignore
    traces:
      span:
        - 'kind == SPAN_KIND_CONSUMER and parent_span_id == SpanID(0x0000000000000000) and attributes["task.framework"] != nil and attributes["task.name"] != nil'
  filter/only-task-roots:
    error_mode: ignore
    traces:
      span:
        - 'not (kind == SPAN_KIND_CONSUMER and parent_span_id == SpanID(0x0000000000000000) and attributes["task.framework"] != nil and attributes["task.name"] != nil)'
  tail_sampling:
    decision_wait: 10s
    # Ten seconds at the expected rate needs ~1000 traces. Bound burst memory.
    num_traces: 5000
    expected_new_traces_per_sec: 100
    policies:
      - name: http-5xx
        type: numeric_attribute
        numeric_attribute:
          key: http.response.status_code
          min_value: 500
          max_value: 599
      - name: otel-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  tail_sampling/task-roots:
    # This branch receives only finished root spans, so duration and outcome
    # are already known. This protects the execution summary, not every child
    # in a long-running trace; children retain the normal best-effort sampling.
    decision_wait: 1s
    num_traces: 5000
    expected_new_traces_per_sec: 100
    policies:
      - name: task-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: task-slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: task-baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

connectors:
  forward/sampled:
  forward/task-roots:
  forward/span-default:
  forward/span-service:
  spanmetrics:
    namespace: traces.span.metrics
    dimensions_cache_size: 1000
    resource_metrics_cache_size: 1000
    metrics_expiration: 5m
  spanmetrics/service:
    namespace: traces.span.metrics
    dimensions_cache_size: 1000
    resource_metrics_cache_size: 1000
    metrics_expiration: 5m
    # Keep these identities aligned with transform/span-service-resource.
    resource_metrics_key_attributes: &span_service_keys
      - service.name
      - service.namespace
      - deployment.environment.name
      - luma.stack
      - luma.task
      - luma.region
  spanmetrics/tasks:
    namespace: task.span
    dimensions_cache_size: 1000
    resource_metrics_cache_size: 1000
    metrics_expiration: 5m
    resource_metrics_key_attributes: *span_service_keys
    dimensions:
      - name: task.name
      - name: task.queue
      - name: task.framework
      - name: task.outcome
    histogram:
      unit: s
      explicit:
        buckets: [10ms, 50ms, 100ms, 500ms, 1s, 2s, 5s, 10s, 30s, 1m, 2m, 5m, 10m, 30m, 2h]

extensions:
  # Manager-local heap profiles let operators identify retained allocations
  # without exposing diagnostic endpoints on the mesh or public interfaces.
  pprof:
    endpoint: 127.0.0.1:1777
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
  bearertokenauth:
    scheme: Bearer
    token: ${env:LUMA_OTLP_TOKEN}

exporters:
  prometheusremotewrite:
    endpoint: http://127.0.0.1:8428/api/v1/write
    # No PRW WAL: in 0.122.0 (and upstream main) TruncateFront cannot remove
    # the newest entry, so the WAL re-sends its tail in a tight loop until new
    # input arrives (~300 copies per point on the production manager). The
    # in-memory queue and default 5-minute retry cover VictoriaMetrics
    # restarts; a Collector crash loses at most the batches still in memory.
    remote_write_queue:
      queue_size: 128
      num_consumers: 2
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/tempo:
    endpoint: http://127.0.0.1:4418
    timeout: 5s
    sending_queue:
      storage: file_storage
      queue_size: 128
      num_consumers: 2
    retry_on_failure:
      max_elapsed_time: 30s
    tls:
      insecure: true

service:
  extensions: [bearertokenauth, file_storage, pprof]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces:
      receivers: [otlp, otlp/mesh]
      # Span metrics use every accepted business span. Only the storage branch
      # is sampled, so fast successes remain in rate/error/duration statistics.
      processors: [memory_limiter, filter/control-agent]
      exporters: [forward/span-default, forward/span-service, forward/sampled, forward/task-roots]
    traces/span-default:
      receivers: [forward/span-default]
      processors: [memory_limiter, filter/span-default]
      exporters: [spanmetrics]
    traces/span-service:
      receivers: [forward/span-service]
      processors: [memory_limiter, filter/span-service]
      exporters: [spanmetrics/service]
    traces/task-metrics:
      receivers: [forward/span-service]
      processors: [memory_limiter, filter/span-service, filter/only-task-roots]
      exporters: [spanmetrics/tasks]
    traces/sampled:
      receivers: [forward/sampled]
      processors: [memory_limiter, filter/exclude-task-roots, tail_sampling, batch]
      exporters: [otlphttp/tempo]
    traces/task-roots:
      receivers: [forward/task-roots]
      processors: [memory_limiter, filter/only-task-roots, tail_sampling/task-roots, batch]
      exporters: [otlphttp/tempo]
    metrics/span:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    metrics/span-service:
      receivers: [spanmetrics/service, spanmetrics/tasks]
      processors: [memory_limiter, transform/span-service-resource, batch]
      exporters: [prometheusremotewrite]
    metrics:
      receivers: [otlp, otlp/mesh, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
