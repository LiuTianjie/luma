receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: traefik
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8082"]
        - job_name: nomad-exporter
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:9107"]

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 180
  batch:
    timeout: 5s
    send_batch_size: 1024

connectors:
  spanmetrics:
    namespace: traces.span.metrics

exporters:
  prometheusremotewrite:
    endpoint: http://127.0.0.1:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [spanmetrics]
    metrics/span:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
