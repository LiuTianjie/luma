receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317
  otlp/mesh:
    protocols:
      http:
        endpoint: ${env:LUMA_OTLP_MESH_BIND}:4319
        include_metadata: true
        auth:
          authenticator: bearertokenauth
  prometheus:
    config:
      scrape_configs:
        - job_name: traefik
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8082"]
        - job_name: nomad-exporter
          scrape_interval: 15s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:9107"]
        - job_name: luma-control
          scrape_interval: 15s
          scrape_timeout: 5s
          metrics_path: /v1/metrics
          static_configs:
            - targets: ["127.0.0.1:8080"]

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 180
  probabilistic_sampler:
    sampling_percentage: 10
  batch:
    timeout: 5s
    send_batch_size: 1024

connectors:
  spanmetrics:
    namespace: traces.span.metrics

extensions:
  bearertokenauth:
    scheme: Bearer
    token: ${env:LUMA_OTLP_TOKEN}

exporters:
  prometheusremotewrite:
    endpoint: http://127.0.0.1:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/tempo:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true

service:
  extensions: [bearertokenauth]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp, otlp/mesh]
      processors: [memory_limiter, probabilistic_sampler, batch]
      exporters: [spanmetrics, otlphttp/tempo]
    metrics/span:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
