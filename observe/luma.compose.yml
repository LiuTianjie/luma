# Control pins this stack to the registered manager (Traefik/Control node) and
# rewrites region/node on deploy. Values below are only the local-render fallback.
name: luma-observe
compose: docker-compose.yml
region: cn

volumes:
  victoria-data:
    local:
      node: manager
      path: /srv/luma/data/luma-observe/victoria
  tempo-data:
    local:
      node: manager
      path: /srv/luma/data/luma-observe/tempo
    initialize: empty

services:
  collector:
    node: manager
    exposure: none
    replicas: 1
  victoria:
    node: manager
    exposure: none
    replicas: 1
  tempo:
    node: manager
    exposure: none
    replicas: 1
  vmalert:
    node: manager
    exposure: none
    replicas: 1
  alertmanager:
    node: manager
    exposure: none
    replicas: 1
  nomad-exporter:
    node: manager
    exposure: none
    replicas: 1
  feishu-webhook:
    node: manager
    exposure: none
    replicas: 1
  host-gateway:
    node: manager
    exposure: none
    replicas: 1
  grafana:
    node: manager
    exposure: none
    replicas: 1

