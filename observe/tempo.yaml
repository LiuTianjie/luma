server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 3201

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4418
        grpc:
          endpoint: 127.0.0.1:4417

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  trace_idle_period: 10s
  max_block_duration: 5m
  # This single-binary instance shares the Manager's disk with Control.
  concurrent_flushes: 1
  max_block_bytes: 67108864 # 64 MiB

compactor:
  compaction:
    # Tempo has no size-based retention or free-space guard, and it shares the
    # Manager's disk with Control and VictoriaLogs. Keep traces short-lived;
    # sampled error/slow traces for recent incidents are what this store is for.
    block_retention: 72h
    max_block_bytes: 268435456 # 256 MiB
    retention_concurrency: 1

storage:
  trace:
    backend: local
    blocklist_poll_concurrency: 2
    search:
      read_buffer_count: 4
    wal:
      path: /data/wal
    local:
      path: /data/blocks

querier:
  max_concurrent_queries: 2

query_frontend:
  search:
    max_duration: 72h

# Bound what one noisy client can write between compactions.
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 2097152 # 2 MiB/s
      burst_size_bytes: 4194304 # 4 MiB
      max_traces_per_user: 5000
    global:
      max_bytes_per_trace: 2097152 # 2 MiB

stream_over_http_enabled: true

usage_report:
  reporting_enabled: false
