[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-infra"
version = "0.2.1"
description = "Declarative deployment CLI for region-aware Nomad infrastructure."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Luma Contributors" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0.1",
  "starlette>=0.49.0",
  "uvicorn[standard]>=0.38.0",
  "websockets>=15.0.1",
  "python-socks[asyncio]>=2.4.0",
]

[project.optional-dependencies]
build-platform = [
  "temporalio==1.34.0; python_version >= '3.10'",
  "psycopg[binary,pool]>=3.2,<4; python_version >= '3.10'",
  "boto3>=1.35,<2; python_version >= '3.10'",
  "cryptography>=44,<47; python_version >= '3.10'",
]
test = [
  "httpx2>=2.4.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/LiuTianjie/luma"
Repository = "https://github.com/LiuTianjie/luma"
Issues = "https://github.com/LiuTianjie/luma/issues"
Documentation = "https://liutianjie.github.io/luma/"

[project.scripts]
luma = "luma.cli:main"

[tool.setuptools.packages.find]
include = ["luma*"]

[tool.setuptools.package-data]
luma = [
  "assets/dashboard/*",
  "build_platform/schema.sql",
]

[tool.ruff]
# The runtime supports Python 3.9 (macOS system Python on home nodes).
target-version = "py39"
extend-exclude = ["dashboard-src", "site", "node_modules", "luma/assets"]

[tool.ruff.lint]
# Correctness only: undefined names, unused imports/variables, syntax errors.
select = ["F", "E9"]
