services:
  eye:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: luma-eye:local
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LUMA_EYE_MODE: all
      LUMA_EYE_LISTEN: ":8090"
      LUMA_EYE_DATA_DIR: /var/lib/luma-eye
      LUMA_EYE_PUBLIC_URL: ${LUMA_EYE_PUBLIC_URL}
      LUMA_EYE_ADMIN_TOKEN: ${LUMA_EYE_ADMIN_TOKEN}
      LUMA_EYE_RELAY_SECRET: ${LUMA_EYE_RELAY_SECRET}
      LUMA_EYE_AUTO_KEY: ${LUMA_EYE_AUTO_KEY}
      LUMA_EYE_AUTO_ORIGIN_SUFFIXES: ".example.com,localhost,127.0.0.1"
      LUMA_EYE_FEISHU_WEBHOOK: ""
      LUMA_EYE_RETENTION_DAYS: "7"
      LUMA_EYE_MAX_STORAGE_GB: "15"
      LUMA_EYE_QUEUE_CAP: "8192"
      LUMA_EYE_CLICKHOUSE_URL: "http://clickhouse:8123"
      LUMA_EYE_CLICKHOUSE_DB: luma_eye
      LUMA_EYE_CLICKHOUSE_USER: default
      LUMA_EYE_CLICKHOUSE_PASSWORD: ""
      GOMEMLIMIT: 280MiB
    volumes:
      - eye-data:/var/lib/luma-eye
    healthcheck:
      test: ["CMD", "luma-eye", "healthcheck", "--url", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.15"
          memory: 128M
        limits:
          memory: 384M

  clickhouse:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse
    image: luma-eye-clickhouse:local
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: luma_eye
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 384M
        limits:
          memory: 1024M

volumes:
  eye-data:
  clickhouse-data:
