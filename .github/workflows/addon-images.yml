name: Build Addon Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - builder/**
      - eye/**
      - observe/**
      - .github/workflows/addon-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: addon-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-addons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: eye/go.mod
          cache-dependency-path: eye/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Luma Eye Go server
        working-directory: eye
        run: go test -race ./...

      - name: Test Luma Build server and runner
        run: |
          python -m pip install -e ".[test]" -e "./builder[test]"
          python scripts/bump-builder-version.py --check
          python -m ruff check builder
          python -m unittest discover -s builder/tests -p 'test_*.py'

      - name: Verify Luma Observe parity, lint, and unit tests
        run: |
          cmp -s luma/alert_sources.py observe/alert_sources.py
          cmp -s luma/log_alert_rules.py observe/log_alert_rules.py
          cmp -s luma/task_results.py observe/task_results.py
          python -m ruff check observe
          python -m unittest tests.test_observe tests.test_observe_access tests.test_observe_logs

  build:
    needs: verify-addons
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: luma-build-server
            context: builder
            dockerfile: builder/Dockerfile.server
          - name: luma-eye
            context: eye
            dockerfile: eye/Dockerfile
          - name: luma-eye-clickhouse
            context: eye/deploy/node-edge
            dockerfile: eye/deploy/node-edge/Dockerfile.clickhouse
          - name: luma-observe-python
            context: observe
            dockerfile: observe/Dockerfile
          - name: luma-observe-access
            context: observe
            dockerfile: observe/Dockerfile.access
          - name: luma-observe-alertmanager
            context: observe
            dockerfile: observe/Dockerfile.alertmanager
          - name: luma-observe-collector
            context: observe
            dockerfile: observe/Dockerfile.collector
          - name: luma-observe-grafana
            context: observe
            dockerfile: observe/Dockerfile.grafana
          - name: luma-observe-log-alerts
            context: observe
            dockerfile: observe/Dockerfile.log-alerts
          - name: luma-observe-tempo
            context: observe
            dockerfile: observe/Dockerfile.tempo
          - name: luma-observe-vmalert
            context: observe
            dockerfile: observe/Dockerfile.vmalert
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/liutianjie/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=addon-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.name }}
