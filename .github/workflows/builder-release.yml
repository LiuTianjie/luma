name: Publish Builder

on:
  push:
    tags:
      - "builder-v*"

permissions:
  contents: read

concurrency:
  group: builder-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the independent builder release
        run: |
          test "$GITHUB_REF_NAME" = "builder-v$(python scripts/bump-builder-version.py --check)"
          python -m pip install -e ".[test]" -e "./builder[test]" build twine
          python -m ruff check builder
          python -m unittest discover -s builder/tests -p 'test_*.py'
          python -m build builder --outdir "$RUNNER_TEMP/builder-dist"
          python -m twine check "$RUNNER_TEMP"/builder-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: builder-distributions
          path: ${{ runner.temp }}/builder-dist/*

  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - component: server
            context: builder
          - component: runner
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#builder-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: builder/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/liutianjie/luma-build-${{ matrix.component }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=builder-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.component }}

  release:
    needs: [checks, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builder-distributions
          path: dist
      - name: Publish versioned distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          printf 'Independent luma-build package and server/runner images.\n\nImages: ghcr.io/liutianjie/luma-build-{server,runner}:%s\n\nDeployment is a separate operator action.\n' "${GITHUB_REF_NAME#builder-}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
