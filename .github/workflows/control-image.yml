name: Build Control Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Dockerfile.control
      - pyproject.toml
      - README.md
      - package.json
      - package-lock.json
      - dashboard-src/**
      - luma/**
      - tests/**
      - scripts/**
      - docs/luma-cli-reference.md
      - .github/workflows/control-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: control-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/liutianjie/luma-control

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[test]"
          npm ci

      - name: Validate image sources
        run: |
          python scripts/bump-version.py --check
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected="v$(python scripts/bump-version.py --check)"
            test "$GITHUB_REF_NAME" = "$expected" || {
              echo "release tag $GITHUB_REF_NAME does not match package version $expected" >&2
              exit 1
            }
          fi
          bash scripts/check-luma.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.control
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
