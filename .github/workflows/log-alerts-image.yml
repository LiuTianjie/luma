name: Build Log Alerts Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: log-alerts-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable release and shared contracts
        run: |
          version="$(python scripts/bump-version.py --check)"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          cmp luma/log_alert_rules.py observe/log_alert_rules.py
          cmp luma/task_results.py observe/task_results.py
          python -m unittest tests.test_task_results.TaskResultTests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: observe
          file: observe/Dockerfile.log-alerts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/liutianjie/luma-log-alerts:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
