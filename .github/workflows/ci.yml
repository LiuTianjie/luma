name: Luma Source Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nomad-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security verification dependencies
        run: |
          python -m pip install -e ".[test]"
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 ufw
      - name: Fetch the pinned Nomad protocol fixture
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          from luma.nomad_security import NOMAD_VERSION, NOMAD_SHA256
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nomad-security"
          root.mkdir()
          archive = root / "nomad.zip"
          urllib.request.urlretrieve(f"https://releases.hashicorp.com/nomad/{NOMAD_VERSION}/nomad_{NOMAD_VERSION}_linux_amd64.zip", archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == NOMAD_SHA256["linux_amd64"]
          with zipfile.ZipFile(archive) as bundle:
              (root / "nomad").write_bytes(bundle.read("nomad"))
          (root / "nomad").chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"LUMA_TEST_NOMAD_BINARY={root / 'nomad'}\n")
          PY
      - name: Verify real ACL and mutual TLS protocols and upgrade recovery
        run: python -m unittest tests.test_nomad_security tests.test_nomad_upgrade -v
      - name: Verify encrypted secrets and workload identities with real Docker allocations
        run: |
          docker pull python:3.12-alpine
          sudo env "PYTHONPATH=$PWD" LUMA_TEST_SECRET_DELIVERY=1 "LUMA_TEST_NOMAD_BINARY=$LUMA_TEST_NOMAD_BINARY" "$(command -v python)" -m unittest tests.test_nomad_secret_delivery -v
      - name: Verify packets in disposable network namespaces
        run: sudo env "PYTHONPATH=$PWD" LUMA_TEST_NETNS=1 "$(command -v python)" -m unittest tests.test_nomad_network_namespace -v

  observe-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Luma
        run: python -m pip install -e .

      - name: Check metrics are delivered exactly once, idle and after an outage
        run: python scripts/check-observe-metrics-delivery.py

      - name: Check standard ingestion, sampling, query auth and config loading
        run: python scripts/check-observe-protocols.py --platform linux/amd64

  observe-tempo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Luma
        run: python -m pip install -e .

      - name: Check fresh trace storage and restart persistence
        run: python scripts/check-observe-tempo.py --platform linux/amd64

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[test]"
          npm ci

      - name: Validate sources
        run: bash scripts/check-luma.sh

      - name: Validate documentation links and translated heading anchors
        run: |
          python -m pip install Markdown==3.8.2
          python scripts/build-site.py --output "$RUNNER_TEMP/site-check"
          python scripts/check-site.py "$RUNNER_TEMP/site-check"

      - name: Verify CLI distribution and assistant skill delivery
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/cli-dist"
          python scripts/check-cli-package.py "$RUNNER_TEMP/cli-dist"

  runtime-python39:
    # Home nodes may self-update with macOS's system Python 3.9. The test suite
    # needs 3.10+, so this job checks that the package installs and runs on 3.9.
    # Python 3.9 builds are unavailable on the newer ubuntu-latest images.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install and smoke-test the CLI
        run: |
          python -m pip install .
          python -m compileall -q luma
          luma --version
          luma observe --help
          luma observe tasks --help
          python -m luma.cli node-agent run --help > /dev/null
          bash scripts/validate-stacks.sh
