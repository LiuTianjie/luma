name: Luma Source Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Luma
        run: python -m pip install -e .

      - name: Check standard ingestion, sampling, query auth and config loading
        run: python scripts/check-observe-protocols.py --platform linux/amd64

  observe-tempo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Luma
        run: python -m pip install -e .

      - name: Check fresh trace storage and restart persistence
        run: python scripts/check-observe-tempo.py --platform linux/amd64

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[test]"
          npm ci

      - name: Validate sources
        run: bash scripts/check-luma.sh

      - name: Verify CLI distribution and assistant skill delivery
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/cli-dist"
          python scripts/check-cli-package.py "$RUNNER_TEMP/cli-dist"

  runtime-python39:
    # Home nodes may self-update with macOS's system Python 3.9. The test suite
    # needs 3.10+, so this job checks that the package installs and runs on 3.9.
    # Python 3.9 builds are unavailable on the newer ubuntu-latest images.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install and smoke-test the CLI
        run: |
          python -m pip install .
          python -m compileall -q luma
          luma --version
          luma observe --help
          luma observe tasks --help
          python -m luma.cli node-agent run --help > /dev/null
          bash scripts/validate-stacks.sh
