# Generated from observe/docker-compose.yml with prebuilt GHCR images for one-click addon install.
services:
  log-alerts:
    image: ghcr.io/liutianjie/luma-observe-log-alerts:latest
    network_mode: host
    restart: unless-stopped
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 32M
        limits:
          memory: 96M
  collector:
    image: ghcr.io/liutianjie/luma-observe-collector:latest
    volumes:
    - collector-data:/var/lib/otelcol
    network_mode: host
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 1024MiB
    depends_on:
    - victoria
    - nomad-exporter
    - tempo
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 768M
        limits:
          memory: 2G
  tempo:
    image: ghcr.io/liutianjie/luma-observe-tempo:latest
    network_mode: host
    restart: unless-stopped
    volumes:
    - tempo-data:/data
    environment:
      GOMEMLIMIT: 2GiB
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 1G
        limits:
          memory: 3G
  victoria:
    image: victoriametrics/victoria-metrics:v1.114.0
    network_mode: host
    restart: unless-stopped
    command:
    - --httpListenAddr=127.0.0.1:8428
    - --retentionPeriod=15d
    - --storageDataPath=/data
    - --storage.minFreeDiskSpaceBytes=2GiB
    - --memory.allowedBytes=384MiB
    - --search.maxConcurrentRequests=4
    - --search.maxMemoryPerQuery=64MiB
    volumes:
    - victoria-data:/data
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 512M
        limits:
          memory: 1G
  vmalert:
    image: ghcr.io/liutianjie/luma-observe-vmalert:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
    - victoria
    - alertmanager
    command:
    - --datasource.url=http://127.0.0.1:8428
    - --remoteWrite.url=http://127.0.0.1:8428
    - --notifier.url=http://127.0.0.1:9093
    - --rule=/etc/vmalert/rules.yml
    - --rule=/etc/luma-observe/extensions/rules/*.yml
    - --rule=/etc/luma-observe/extensions/rules/*.yaml
    - --configCheckInterval=30s
    - --httpListenAddr=127.0.0.1:8880
    - --evaluationInterval=30s
    volumes:
    - observe-extensions:/etc/luma-observe/extensions:ro
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          memory: 128M
  alertmanager:
    image: ghcr.io/liutianjie/luma-observe-alertmanager:latest
    network_mode: host
    restart: unless-stopped
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --web.listen-address=127.0.0.1:9093
    - --storage.path=/alertmanager
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          memory: 128M
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.25.0
    network_mode: host
    restart: unless-stopped
    command:
    - -httpListenAddr=127.0.0.1:9428
    - -retentionPeriod=15d
    - -storageDataPath=/data
    - -retention.maxDiskSpaceUsageBytes=4GiB
    - -storage.minFreeDiskSpaceBytes=2GiB
    volumes:
    - victorialogs-data:/data
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits:
          memory: 1G
  log-shipper:
    image: ghcr.io/liutianjie/luma-observe-python:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
    - victoria-logs
    command:
    - /app/log_shipper.py
    environment:
      NOMAD_ADDR: http://127.0.0.1:4646
      LUMA_OBSERVE_BIND: 127.0.0.1
      LUMA_OBSERVE_PORT: '9108'
      VICTORIALOGS_URL: http://127.0.0.1:9428
      LUMA_LOG_CHECKPOINT: /var/lib/log-shipper/cursors.json
    volumes:
    - log-shipper-data:/var/lib/log-shipper
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          memory: 256M
  nomad-exporter:
    image: ghcr.io/liutianjie/luma-observe-python:latest
    network_mode: host
    restart: unless-stopped
    command:
    - /app/nomad_exporter.py
    environment:
      NOMAD_ADDR: http://127.0.0.1:4646
      LUMA_OBSERVE_BIND: 127.0.0.1
      LUMA_OBSERVE_PORT: '9107'
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          memory: 96M
  feishu-webhook:
    image: ghcr.io/liutianjie/luma-observe-python:latest
    network_mode: host
    restart: unless-stopped
    command:
    - /app/feishu_webhook.py
    environment:
      LUMA_OBSERVE_BIND: 127.0.0.1
      LUMA_OBSERVE_PORT: '9095'
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          memory: 96M
  host-gateway:
    image: ghcr.io/liutianjie/luma-observe-python:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
    - victoria
    command:
    - /app/host_gateway.py
    environment:
      LUMA_OBSERVE_UPSTREAM_HOST: 127.0.0.1
      LUMA_OBSERVE_UPSTREAM_PORT: '8428'
      LUMA_OBSERVE_PORT: '8428'
      LUMA_OBSERVE_GATEWAY_IFACES: nomad,docker0
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 32M
        limits:
          memory: 64M
  observe-access:
    image: ghcr.io/liutianjie/luma-observe-access:latest
    network_mode: host
    restart: unless-stopped
    environment:
      LUMA_OBSERVE_READ_TOKEN: ${LUMA_OBSERVE_READ_TOKEN}
      LUMA_OBSERVE_INGEST_TOKEN: ''
      LUMA_OBSERVE_SCOPED_READERS: ''
      GOMEMLIMIT: 48MiB
      PYTHONDONTWRITEBYTECODE: '1'
    command:
    - -httpListenAddr=127.0.0.1:8427
    - -httpInternalListenAddr=127.0.0.1:8429
    - -maxConcurrentRequests=32
    - -maxConcurrentPerUserRequests=4
    - -responseTimeout=3s
    deploy:
      resources:
        reservations:
          cpus: '0.05'
          memory: 32M
        limits:
          memory: 128M
  grafana:
    image: ghcr.io/liutianjie/luma-observe-grafana:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
    - victoria
    - tempo
    - victoria-logs
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3100'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_USERS_VIEWERS_CAN_EDIT: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LUMA_OBSERVE_GRAFANA_ADMIN_PASSWORD:-}
    volumes:
    - observe-extensions:/etc/luma-observe/extensions:ro
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 128M
        limits:
          memory: 256M
volumes:
  collector-data: null
  log-shipper-data: null
  victoria-data: null
  tempo-data: null
  victorialogs-data: null
  observe-extensions: null
