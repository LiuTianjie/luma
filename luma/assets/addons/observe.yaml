apiVersion: luma.addon/v1
id: observe
name: Luma Observe
category: observability
stack: luma-observe
primaryService: grafana
sourceDir: observe
description:
  en: Unified metrics (VictoriaMetrics), logs (VictoriaLogs), traces (Tempo), alerts, and Grafana dashboards on Manager.
  zh: 基于 VictoriaMetrics、VictoriaLogs、Tempo 与 Grafana 的全栈指标、日志、链路追踪与告警套件。
auth:
  mode: forward-auth
  consolePath: /grafana
  cliAuth: control-proxy
ui:
  icon: observe
  openMode: internal
  dashboardPath: /observe/apps
  healthPath: /v1/dashboard/observe/status
uiCapabilities:
  - observe.status
  - observe.apps
  - observe.logs
  - observe.traces
  - observe.dashboards
  - observe.alerts
  - observe.settings
requirements:
  minMemoryMb: 4096
  recommendedMemoryMb: 8192
  minCpu: 2
  stateful: true
  pinPolicy: manager
  note:
    en: Runs 13 observability components (VictoriaMetrics, VictoriaLogs, Tempo, Grafana, OTel Collector) pinned to the Manager node; >= 8 GiB RAM on Manager is recommended.
    zh: 包含 13 个可观测组件（VictoriaMetrics、VictoriaLogs、Tempo、Grafana、OTel Collector），固定运行在 Manager 节点，建议 Manager 至少 8 GiB 可用/总内存。
defaultImages:
  log-alerts: ghcr.io/liutianjie/luma-observe-log-alerts:latest
  collector: ghcr.io/liutianjie/luma-observe-collector:latest
  tempo: ghcr.io/liutianjie/luma-observe-tempo:latest
  victoria: victoriametrics/victoria-metrics:v1.114.0
  vmalert: ghcr.io/liutianjie/luma-observe-vmalert:latest
  alertmanager: ghcr.io/liutianjie/luma-observe-alertmanager:latest
  victoria-logs: victoriametrics/victoria-logs:v1.25.0
  log-shipper: ghcr.io/liutianjie/luma-observe-python:latest
  nomad-exporter: ghcr.io/liutianjie/luma-observe-python:latest
  feishu-webhook: ghcr.io/liutianjie/luma-observe-python:latest
  host-gateway: ghcr.io/liutianjie/luma-observe-python:latest
  observe-access: ghcr.io/liutianjie/luma-observe-access:latest
  grafana: ghcr.io/liutianjie/luma-observe-grafana:latest
presets:
  - id: manager
    label:
      en: Manager Host-Network Stack
      zh: Manager 节点全栈部署
    description:
      en: Deploys the full observability stack pinned to the Manager node with zero-config /grafana forwardAuth SSO.
      zh: 固定部署在 Manager 节点，自动注入 OTel 链路采集并通过 Control forwardAuth 保护 /grafana。
    defaultRegion: cn
    defaultExposure: none
    defaultNode: manager
configSchema:
  - key: region
    type: region
    group: placement
    tier: basic
    required: true
    default: cn
    label:
      en: Manager Region
      zh: Manager 区域
    description:
      en: Matches the Manager node's scheduling region.
      zh: 需与 Manager 节点所属区域一致。
  - key: feishuWebhookUrl
    type: secret
    group: integrations
    tier: advanced
    required: false
    env: FEISHU_WEBHOOK_URL
    label:
      en: Alertmanager Feishu Webhook
      zh: Alertmanager 飞书 Webhook
    description:
      en: Optional webhook used by the observe feishu-webhook relay.
      zh: 可选，用于 Observe 告警转发至飞书群。
autoSecrets:
  - name: LUMA_OBSERVE_READ_TOKEN
    bytes: 32
    format: urlsafe
    description: Bearer token for authenticated external read access via observe-access (vmauth).
  - name: LUMA_OBSERVE_INGEST_TOKEN
    bytes: 32
    format: urlsafe
    description: Bearer token for external OTLP metrics/traces ingestion via observe-access.
